   <g id="text_1">
    <text style="fill: #1e3a8a; font: 700 10.5px 'Microsoft YaHei'; text-anchor: start" x="33.516" y="37.919602" transform="rotate(-0 33.516 37.919602)">第一部分：四类提示改动的同批对照与留出集独立检验（72 次正式调用 + 9 次试跑校准）</text>
   </g>
   <g id="text_2">
    <text style="fill: #065f46; font: 700 10.5px 'Microsoft YaHei'; text-anchor: start" x="33.516" y="176.519602" transform="rotate(-0 33.516 176.519602)">第二部分：文学评价口径敏感性分析与注释粒度消融实验（24 次补充消融调用）</text>
   </g>
   <g id="text_3">
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(56.460188 69.867647)">1. 语料构建与参数校准</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(42.340172 81.410684)">12 首诗词（8 开发 + 4 测试）</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(44.665 92.953722)">逐首设定文化词与诗学关系点</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(42.999375 104.496759)">试跑 9 次锁定输出上限 12000</text>
   </g>
   <g id="text_4">
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(202.741187 69.867647)">2. 开发集四方案同批对照</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(186.611531 81.410684)">直接译 / 任务标准 / 参考注 / 示例</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(187.407828 92.953722)">开发集 32 次 + 稳定性采样 24 次</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(196.236922 104.496759)">固定同一模型与解码温度 0.2</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(353.122187 69.867647)">3. 双视角匿名盲评与选型</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(339.959266 81.410684)">忠实文学译介 + 自由改写双视角</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(338.922734 92.953722)">参考注释版术语分最高（0.969）</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(337.227 104.496759)">任务标准版散文化且耗时翻倍淘汰</text>
   </g>
   <g id="text_6">
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(506.208188 69.867647)">4. 留出测试集独立验证</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(481.382047 81.410684)">《枫桥夜泊》《春晓》等 4 首留出诗</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(489.582047 92.953722)">直接翻译与参考注释各重复 2 次</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(486.213 104.496759)">术语同为满分，按最简胜出留基线</text>
   </g>
   <g id="text_7">
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(48.260188 208.467647)">5. 词义与歧义评价口径分析</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(38.160734 220.010684)">区分完全误译（0次）与局部润色</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(36.465 231.553722)">检验接纳功能对等异译的得分变化</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(36.465 243.096759)">统一《枫桥夜泊》歧义句评判标准</text>
   </g>
   <g id="text_8">
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(198.641187 208.467647)">6. 注释粒度三条件消融设计</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(186.689687 220.010684)">无注释 / 单条核心注 / 完整词表注</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(190.946 231.553722)">完整词表严格包含单条核心注释</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(186.846 243.096759)">隔离注释内容质量与词条数量效应</text>
   </g>
   <g id="text_9">
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(349.022187 208.467647)">7. 诊断名篇与拓展新诗检验</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(337.227 220.010684)">复测《登鹳雀楼》与《枫桥夜泊》</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(341.327 231.553722)">拓展《商山早行》与《竹里馆》</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(337.460828 243.096759)">每首每条件重复 2 次（共 24 次）</text>
   </g>
   <g id="text_10">
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(498.008188 208.467647)">8. 成本拆解与最终方法裁决</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(493.199656 220.010684)">三条件术语与关系分均达 1.00</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(486.134844 231.553722)">完整词表诱发尾注增至 3.88 行/首</text>
    <text style="fill: #1f2937; font: 8.2px 'Microsoft YaHei'" transform="translate(484.845266 243.096759)">确立“最简基线 + 按需单条注释”</text>
   </g>
