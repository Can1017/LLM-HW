   <g id="text_11">
    <text style="fill: #374151; font: 700 8.8px 'Microsoft YaHei'; text-anchor: start" x="332.604" y="148.331437" transform="rotate(-0 332.604 148.331437)">针对留出集天花板效应与局部注释假设展开深度消融（总计 96 次正式调用）</text>
